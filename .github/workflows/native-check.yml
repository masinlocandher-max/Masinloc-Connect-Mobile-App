name: Native App Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - name: Generate Android project and branded assets
        run: npx cap add android && npm run assets:android && npx cap sync android && npm run native:configure
      - name: Verify Android auth, location and app assets
        run: |
          grep -q 'android:scheme="com.masinloc.connect"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          find android/app/src/main/res -path '*mipmap*' -type f -name 'ic_launcher*.png' -print -quit | grep -q .
      - name: Compile Android debug APK
        run: cd android && ./gradlew assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate iOS project and branded assets
        run: npx cap add ios && npm run assets:ios && npx cap sync ios && npm run native:configure
      - name: Verify iOS auth, location and app assets
        run: |
          grep -q '<string>com.masinloc.connect</string>' ios/App/App/Info.plist
          grep -q '<key>NSLocationWhenInUseUsageDescription</key>' ios/App/App/Info.plist
          grep -q 'Masinloc Connect uses your location only when you choose Use GPS in Help Desk' ios/App/App/Info.plist
          find ios/App/App/Assets.xcassets/AppIcon.appiconset -type f -name '*.png' -print -quit | grep -q .
      - name: Compile iOS simulator build
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
