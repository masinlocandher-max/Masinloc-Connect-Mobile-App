name: Mobile App CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Commit generated dependency lock on agent branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock release dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Audit dependencies for high-severity issues
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Verify release packaging
        run: npm run check:release

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: npm run test:e2e
