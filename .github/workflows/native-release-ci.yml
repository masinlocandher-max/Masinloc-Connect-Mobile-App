name: Native Release CI

on:
  push:
    branches:
      - agent/native-release-candidate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web bundle
        run: npm run build && npx cap sync android

      - name: Apply native contract
        run: npm run native:configure && npm run native:verify

      - name: Assemble unsigned Android debug app
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web bundle
        run: npm run build && npx cap sync ios

      - name: Apply native contract
        run: npm run native:configure && npm run native:verify

      - name: Build unsigned iOS Simulator app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
