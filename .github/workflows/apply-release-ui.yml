name: Apply Release UI

on:
  push:
    branches:
      - agent/native-release-candidate
    paths:
      - 'scripts/apply-release-ui-patch.mjs'
      - '.github/workflows/apply-release-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-release-candidate

      - name: Apply release UI patch
        run: node scripts/apply-release-ui-patch.mjs

      - name: Verify production build
        run: npm ci && npm run build

      - name: Commit release UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "Release UI already current."
            exit 0
          fi
          git commit -m "Add in-app account deletion flow"
          git push origin HEAD:agent/native-release-candidate
