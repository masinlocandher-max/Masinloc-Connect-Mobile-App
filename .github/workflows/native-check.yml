name: Native App Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - name: Generate Android project
        run: npx cap add android && npx cap sync android && npm run native:configure
      - name: Verify Android auth scheme
        run: grep -q 'android:scheme="com.masinloc.connect"' android/app/src/main/AndroidManifest.xml
      - name: Compile Android debug APK
        run: cd android && ./gradlew assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Generate iOS project
        run: npx cap add ios && npx cap sync ios && npm run native:configure
      - name: Verify iOS auth scheme
        run: grep -q '<string>com.masinloc.connect</string>' ios/App/App/Info.plist
      - name: Compile iOS simulator build
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
